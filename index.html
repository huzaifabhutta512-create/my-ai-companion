<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Companion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #080d25, #24104b);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .app-container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      height: 92vh;
      max-height: 750px;
    }
    .header {
      text-align: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .avatar { font-size: 48px; }
    h1 { color: #a78bfa; margin: 4px 0; font-size: 22px; }
    .subtitle { margin: 0; font-size: 13px; color: #cbd5e1; }
    .controls {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    select, .key-btn {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
    }
    select option { background: #1e1b4b; color: white; }
    .key-btn { cursor: pointer; background: #4c1d95; }
    #apiPanel {
      display: none;
      margin-top: 10px;
      background: rgba(0, 0, 0, 0.35);
      padding: 10px;
      border-radius: 12px;
      text-align: center;
    }
    #apiPanel input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .save-key-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    #chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 82%;
      line-height: 1.5;
      font-size: 14px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .user {
      background: #8b5cf6;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .ai {
      background: rgba(255, 255, 255, 0.14);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    #msgInput {
      flex: 1;
      padding: 12px 15px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 14px;
    }
    #sendBtn {
      padding: 12px 18px;
      border: none;
      border-radius: 25px;
      background: #8b5cf6;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #sendBtn:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div class="avatar">👩🏻‍💻</div>
      <h1>My AI Companion</h1>
      <p class="subtitle">میری AI دوست میں خوش آمدید!</p>

      <div class="controls">
        <select id="modeSelect">
          <option value="friend">Friend Mode (دوستانہ)</option>
          <option value="direct">Direct Mode (مختصر)</option>
        </select>

        <select id="langSelect">
          <option value="auto">Language: Auto</option>
          <option value="ur">اردو (Urdu)</option>
          <option value="en">English</option>
          <option value="hi">हिन्दी (Hindi)</option>
        </select>

        <button class="key-btn" onclick="toggleApiPanel()">🔑 API Key</button>
      </div>

      <div id="apiPanel">
        <input type="password" id="apiKeyInput" placeholder="OpenAI API Key یہاں پیسٹ کریں (sk-...)">
        <button class="save-key-btn" onclick="saveApiKey()">Save Key</button>
        <div style="font-size:11px; color:#cbd5e1; margin-top:4px;">اگر Key نہیں ہے تو خالی چھوڑ دیں، Demo Mode چلے گا۔</div>
      </div>
    </div>

    <div id="chatBox">
      <div class="msg ai">سلام! میں My AI Companion ہوں۔ آپ مجھ سے اردو، انگلش یا ہندی میں بات کر سکتے ہیں۔ اپنا پیغام لکھیں!</div>
    </div>

    <div class="input-area">
      <input type="text" id="msgInput" placeholder="اپنا پیغام لکھیں..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let chatHistory = [];
    let lastMsgTime = 0;

    // محفوظ کی گئی API Key لوڈ کریں
    window.onload = () => {
      const savedKey = localStorage.getItem("openai_api_key");
      if (savedKey) document.getElementById("apiKeyInput").value = savedKey;
    };

    function toggleApiPanel() {
      const panel = document.getElementById("apiPanel");
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    }

    function saveApiKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (key) {
        localStorage.setItem("openai_api_key", key);
        alert("API Key محفوظ ہو گئی ہے!");
      } else {
        localStorage.removeItem("openai_api_key");
        alert("API Key ہٹا دی گئی ہے (Demo Mode فعال)۔");
      }
      toggleApiPanel();
    }

    function getLanguageInstruction(lang) {
      const map = {
        ur: "ہمیشہ اردو میں جواب دیں۔",
        en: "Always reply in English.",
        hi: "हमेशा हिन्दी में जवाब दें।",
        auto: "صارف کی زبان پہچانیں اور اسی زبان میں جواب دیں۔"
      };
      return map[lang] || map.auto;
    }

    const AI_PERSONALITY = `
You are My AI Companion, a thoughtful, intelligent, friendly and reliable multilingual AI assistant.
CORE RULES:
1. Understand the user's actual question before answering.
2. Never knowingly invent facts, sources or events.
3. If uncertain, clearly say that you are uncertain.
4. Explain difficult topics in simple language.
5. Do not pretend to be a real human.
6. Give safe and responsible guidance. For medical, legal and financial matters, explain limitations.
7. Be respectful, patient and helpful.
FRIEND MODE: Be warm, natural, supportive and conversational. Ask relevant follow-up questions when helpful.
DIRECT MODE: Give concise, clear and task-focused answers. Avoid unnecessary conversation.
`;

    // اگر API Key نہ ہو تو Demo Mode جواب
    function getDemoReply(text, mode, lang) {
      const t = text.toLowerCase();
      if (lang === "en" || (/^[a-z0-9\s?!.,]+$/i.test(text) && lang === "auto")) {
        if (t.includes("hello") || t.includes("hi") || t.includes("salam")) {
          return mode === "direct"
            ? "Hello! How can I help you?"
            : "Hello! Great to chat with you. How is your day going, and what would you like to talk about?";
        }
        return mode === "direct"
          ? `Received: "${text}". Add your OpenAI API Key in settings (🔑) for full AI answers.`
          : `I hear you! You said: "${text}". Right now I am running in Demo Mode—tap the 🔑 API Key button at the top to add your OpenAI key for full smart replies!`;
      }
      if (t.includes("سلام") || t.includes("salam") || t.includes("hello") || t.includes("ہیلو")) {
        return mode === "direct"
          ? "وعلیکم السلام! میں آپ کی کیا مدد کر سکتا ہوں؟"
          : "وعلیکم السلام! آپ سے بات کر کے بہت خوشی ہوئی۔ بتائیں آج میں آپ کی کیا مدد کر سکتا ہوں؟";
      }
      return mode === "direct"
        ? `آپ کا پیغام: "${text}"۔ مکمل AI جوابات کے لیے اوپر 🔑 API Key لگائیں۔`
        : `بہت خوب! آپ نے لکھا: "${text}"۔ ابھی میں Demo Mode میں ہوں—مکمل ذہین AI جوابات کے لیے اوپر 🔑 API Key والے بٹن پر کلک کر کے اپنی OpenAI Key لگا لیں!`;
    }

    async function sendMessage() {
      const input = document.getElementById("msgInput");
      const chatBox = document.getElementById("chatBox");
      const btn = document.getElementById("sendBtn");
      const mode = document.getElementById("modeSelect").value;
      const language = document.getElementById("langSelect").value;
      const text = input.value.trim();

      if (!text) return;
      if (text.length > 8000) {
        alert("پیغام بہت لمبا ہے۔ اسے مختصر کریں۔");
        return;
      }

      // بنیادی Rate Limiting (2 سیکنڈ وقفہ)
      const now = Date.now();
      if (now - lastMsgTime < 1500) return;
      lastMsgTime = now;

      chatBox.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
      input.value = "";
      btn.disabled = true;
      chatBox.scrollTop = chatBox.scrollHeight;

      const apiKey = localStorage.getItem("openai_api_key");

      // اگر API Key نہیں لگی تو Demo Mode چلائیں
      if (!apiKey) {
        setTimeout(() => {
          const demoReply = getDemoReply(text, mode, language);
          chatBox.innerHTML += `<div class="msg ai">${escapeHtml(demoReply)}</div>`;
          btn.disabled = false;
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 500);
        return;
      }

      // OpenAI API کال
      const instructions = `${AI_PERSONALITY}\n${getLanguageInstruction(language)}\nCurrent mode: ${mode}`;
      const messages = [
        { role: "system", content: instructions },
        ...chatHistory.slice(-12),
        { role: "user", content: text }
      ];

      try {
        const res = await fetch("https://openai.com", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "gpt-4.1-mini",
